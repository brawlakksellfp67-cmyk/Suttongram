<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Suttongram</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0e1621;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none!important}
#auth{max-width:380px;margin:auto;padding:26px 22px;background:#17212b;border-radius:22px;width:90%;text-align:center}
.logo{width:70px;height:70px;background:linear-gradient(135deg,#2aabee,#229ed9);border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:34px}
input,select{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:14px;border:1px solid #232e3c;background:#242f3d;color:#fff;font-size:15px;outline:none}
button{width:100%;padding:12px;border-radius:14px;border:none;background:#2aabee;color:#fff;font-size:15px;font-weight:600;margin-bottom:8px;cursor:pointer}
button.sec{background:#242f3d;color:#2aabee}
header{background:#17212b;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;height:56px;flex-shrink:0}
.stars{background:#242f3d;padding:5px 12px;border-radius:20px;color:#ffd700;font-weight:700;font-size:14px}
.search-wrap{background:#17212b;padding:0 12px 10px;flex-shrink:0}
.search-box{background:#242f3d;border-radius:20px;padding:8px 14px;display:flex;align-items:center;gap:8px;color:#7f91a4}
.search-box input{background:none;border:none;margin:0;padding:0;font-size:15px;color:#fff}
.tabs-bar{background:#17212b;display:flex;gap:18px;padding:0 16px 10px;border-bottom:1px solid #0b121b;font-size:14px;font-weight:600;color:#7f91a4;flex-shrink:0}
.tabs-bar span.act{color:#2aabee;position:relative}
.tabs-bar span.act::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:3px;background:#2aabee;border-radius:3px}
main{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:78px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #131c27;cursor:pointer}
.row:active{background:#17212b}
.ava{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#3b9ee3,#1e73b8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0;text-transform:uppercase;background-size:cover;background-position:center;overflow:hidden;color:#fff}
.ava.lg{width:76px;height:76px;font-size:26px;border:2px solid #2aabee}
.ava.xs{width:20px;height:20px;font-size:9px;margin-bottom:2px}
.r-mid{flex:1;min-width:0}
.r-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.r-name{font-weight:600;font-size:16px;display:flex;align-items:center;gap:5px}
.r-time{font-size:12px;color:#7f91a4}
.r-msg{font-size:14px;color:#7f91a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{background:#2aabee;color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
#bnav{position:fixed;bottom:10px;left:10px;right:10px;background:rgba(23,33,43,0.95);backdrop-filter:blur(10px);border:1px solid #233040;border-radius:28px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:58px;padding:4px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#bnav button{background:none;border-radius:22px;margin:0;padding:4px 1px;font-size:10px;color:#8e9fad;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
#bnav button.act{background:#233346;color:#2aabee}
.badge{position:absolute;top:4px;right:14px;background:#2aabee;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px}
#cview{display:flex;flex-direction:column;height:100%}
#mbox{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:15px;word-wrap:break-word}
.mine{background:#2b5278;align-self:flex-end;border-bottom-right-radius:4px}
.theirs{background:#182533;align-self:flex-start;border-bottom-left-radius:4px}
.cbar{background:#17212b;padding:8px 10px;display:flex;gap:8px;align-items:center}
.cbar input{margin:0;flex:1;border-radius:20px;padding:10px 14px}
.cbar button{width:42px;height:42px;border-radius:50%;margin:0;padding:0;flex-shrink:0}
.pad{padding:14px}
.card{background:#17212b;padding:14px;border-radius:16px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:#17212b;padding:14px;border-radius:16px;text-align:center}
.btn-sm{width:auto;padding:7px 12px;font-size:13px;margin:0;border-radius:10px}
</style>
</head>
<body>
<div id="auth">
<div class="logo">✈️</div>
<h2 style="margin-bottom:14px">Suttongram</h2>
<input id="uin" placeholder="Никнейм">
<input type="password" id="pin" placeholder="Пароль (от 6 символов)">
<button onclick="auth(0)">Войти</button>
<button class="sec" onclick="auth(1)">Создать аккаунт</button>
<p id="err" style="color:#ff6b6b;font-size:13px;margin-top:6px"></p>
</div>
<div id="app" class="hidden" style="display:flex;flex-direction:column;height:100dvh">
<header>
<div style="display:flex;align-items:center;gap:10px">
<button id="bbtn" class="sec hidden" onclick="closeC()" style="width:auto;margin:0;padding:6px 10px">←</button>
<b id="hdr" style="font-size:19px">Suttongram</b>
</div>
<div style="display:flex;align-items:center;gap:8px">
<button id="cbtn" class="sec hidden" onclick="call()" style="width:38px;height:38px;border-radius:50%;margin:0;padding:0">📞</button>
<div class="stars">⭐ <span id="st">0</span></div>
</div>
</header>
<div id="top-bar">
<div class="search-wrap"><div class="search-box">🔍 <input id="srch" placeholder="Поиск по друзьям" oninput="renderList()"></div></div>
<div class="tabs-bar"><span id="f-all" class="act" onclick="setFilter('all')">Все чаты</span><span id="f-own" onclick="setFilter('own')">👑 Владельцы</span></div>
</div>
<main id="main-box">
<div id="t-chats" style="height:100%;display:flex;flex-direction:column">
<div id="ulist"></div>
<div id="cview" class="hidden">
<div id="mbox"></div>
<div class="cbar"><input id="minp" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
</div>
</div>
<div id="t-fr" class="hidden pad">
<div class="card">
<h4 style="margin-bottom:8px;font-size:15px">➕ Найти друга по нику</h4>
<div style="display:flex;gap:8px"><input id="f-srch" placeholder="Введи ник (напр. grafin4ik)" style="margin:0"><button class="btn-sm" onclick="findFr()">Найти</button></div>
<div id="f-res" style="margin-top:10px"></div>
</div>
<div id="req-box"></div>
<div style="color:#7f91a4;font-size:12px;font-weight:700;margin:12px 0 8px">👥 МОИ ДРУЗЬЯ</div>
<div id="flist"></div>
</div>
<div id="t-shop" class="hidden pad">
<div class="card">
<div style="color:#7f91a4;font-size:12px;margin-bottom:6px">🎁 КОМУ ОТПРАВИТЬ ПОДАРОК:</div>
<select id="grec" style="margin:0"></select>
</div>
<div class="grid" id="slist"></div>
</div>
<div id="t-prof" class="hidden pad">
<div class="card" style="display:flex;align-items:center;gap:14px">
<div id="pava" class="ava lg" onclick="$('ain').click()"></div>
<input type="file" id="ain" accept="image/*" class="hidden" onchange="upAva(this)">
<div>
<b id="pname" style="font-size:18px"></b>
<div id="prole" style="color:#2aabee;font-size:13px">в сети</div>
<div onclick="$('ain').click()" style="color:#7f91a4;font-size:12px;margin-top:6px">📷 Сменить фото</div>
</div>
</div>
<div class="grid" id="mgifts"></div>
<button class="sec" onclick="logout()" style="margin-top:16px;color:#ff6b6b">Выйти</button>
</div>
<div id="t-own" class="hidden pad">
<div class="card"><select id="ausel"></select><input type="number" id="aamt" placeholder="Сколько звёзд"><button onclick="give()">Выдать звёзды</button></div>
<div class="card"><input id="nge" placeholder="Эмодзи 🧸"><input id="ngn" placeholder="Название"><input type="number" id="ngp" placeholder="Цена"><button onclick="addG()">Добавить подарок</button></div>
</div>
</main>
<nav id="bnav">
<button class="act" onclick="tab('chats',this)"><span style="font-size:18px">💬</span>Чаты</button>
<button onclick="tab('fr',this)"><span style="font-size:18px">👥</span>Друзья<span id="fbadge" class="badge hidden">0</span></button>
<button onclick="tab('shop',this)"><span style="font-size:18px">🛍️</span>Подарки</button>
<button onclick="tab('prof',this)"><div id="nava" class="ava xs"></div>Профиль</button>
<button id="nown" class="hidden" onclick="tab('own',this)"><span style="font-size:18px">👑</span>Админка</button>
</nav>
</div>
<script>
const B = "https://idashrgfukgszyrqpjid." + "supabase.co";
const K = "sb_publishable_wEuPnq7xgewXLeWYmoG5iw_0ZzT25i_";
const H = { "apikey": K, "Content-Type": "application/json", "Prefer": "return=representation" };
const $ = i => document.getElementById(i);
let me = null, ch = null, us = [], frs = [], allMsgs = [], flt = "all", tm = null;

async function api(p, m = "GET", b = null) {
  const r = await fetch(B + p, { method: m, headers: H, body: b ? JSON.stringify(b) : null });
  const t = await r.text();
  let d = {};
  try { d = JSON.parse(t); } catch (e) {}
  if (!r.ok) throw new Error(d.msg || d.message || t);
  return d;
}

function setAva(el, u) {
  if (u && u.avatar) { el.style.backgroundImage = "url(" + u.avatar + ")"; el.innerText = ""; }
  else { el.style.backgroundImage = "none"; el.innerText = u ? u.username.slice(0, 2) : "?"; }
}

function enter() {
  localStorage.setItem("sg_id", me.id);
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  loadAll(); loadS();
}

function logout() { localStorage.removeItem("sg_id"); location.reload(); }

async function auth(reg) {
  $('err').innerText = "Загрузка...";
  try {
    const u = $('uin').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
    const p = $('pin').value;
    if (!u || p.length < 6) throw new Error("Ник (англ.) и пароль от 6 символов");
    const em = u + "@gmail.com";
    if (reg) {
      const a = await api("/auth/v1/signup", "POST", { email: em, password: p });
      const uid = (a.user && a.user.id) || a.id;
      const ex = await api("/rest/v1/profiles?select=id");
      const f = ex.length === 0;
      const pr = await api("/rest/v1/profiles", "POST", { id: uid, username: u, stars: f ? 9999 : 50, is_owner: f });
      me = pr.at(0);
    } else {
      const a = await api("/auth/v1/token?grant_type=password", "POST", { email: em, password: p });
      const pr = await api("/rest/v1/profiles?id=eq." + a.user.id);
      me = pr.at(0);
    }
    if (!me) throw new Error("Профиль не найден");
    enter();
  } catch (e) { $('err').innerText = e.message; }
}

function setFilter(f) {
  flt = f;
  $('f-all').className = f === 'all' ? 'act' : '';
  $('f-own').className = f === 'own' ? 'act' : '';
  renderList();
}

function getFriendIds() {
  const ids = [];
  frs.forEach(f => {
    if (f.status === 'accepted') {
      if (f.user_id === me.id) ids.push(f.friend_id);
      if (f.friend_id === me.id) ids.push(f.user_id);
    }
  });
  return ids;
}

async function loadAll() {
  us = await api("/rest/v1/profiles?select=*");
  frs = await api(`/rest/v1/friends?or=(user_id.eq.${me.id},friend_id.eq.${me.id})`);
  allMsgs = await api(`/rest/v1/messages?or=(sender_id.eq.${me.id},receiver_id.eq.${me.id})&order=created_at.desc`);
  me = us.find(x => x.id === me.id) || me;
  $('st').innerText = me.stars;
  setAva($('pava'), me); setAva($('nava'), me);
  $('pname').innerHTML = "@" + me.username + (me.is_owner ? '<span class="ok">✓</span>' : '');
  if (me.is_owner) { $('prole').innerText = "Создатель Suttongram 👑"; $('nown').classList.remove('hidden'); }

  const fIds = getFriendIds();
  $('grec').innerHTML = ""; $('ausel').innerHTML = "";
  us.forEach(u => {
    $('ausel').innerHTML += `<option value="${u.id}">@${u.username} (⭐${u.stars})</option>`;
    if (fIds.includes(u.id)) $('grec').innerHTML += `<option value="${u.id}">@${u.username}</option>`;
  });
  if (!$('grec').innerHTML) $('grec').innerHTML = `<option value="">Сначала добавь друга в разделе 👥 Друзья</option>`;

  renderList();
  renderFriends();
}

function renderList() {
  const q = ($('srch').value || "").toLowerCase();
  const fIds = getFriendIds();
  $('ulist').innerHTML = "";
  us.forEach(u => {
    if (!fIds.includes(u.id)) return;
    if (flt === 'own' && !u.is_owner) return;
    if (q && !u.username.toLowerCase().includes(q)) return;
    const last = allMsgs.find(m => m.sender_id === u.id || m.receiver_id === u.id);
    const txt = last ? (last.content.startsWith("CALL::") ? "📞 Звонок" : last.content) : "Нажмите, чтобы написать";
    const tmStr = last ? new Date(last.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
    const row = document.createElement('div');
    row.className = 'row';
    row.onclick = () => openC(u);
    const av = document.createElement('div');
    av.className = 'ava';
    setAva(av, u);
    row.appendChild(av);
    row.innerHTML += `<div class="r-mid"><div class="r-top"><div class="r-name">@${u.username}${u.is_owner ? '<span class="ok">✓</span>' : ''}</div><span class="r-time">${tmStr}</span></div><div class="r-msg">${txt}</div></div>`;
    $('ulist').appendChild(row);
  });
  if (!$('ulist').innerHTML) $('ulist').innerHTML = "<p class='pad' style='color:#7f91a4'>У тебя пока нет друзей в чатах. Зайди во вкладку 👥 Друзья и добавь по нику!</p>";
}

function renderFriends() {
  const incoming = frs.filter(f => f.friend_id === me.id && f.status === 'pending');
  const badge = $('fbadge');
  if (incoming.length > 0) { badge.innerText = incoming.length; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');

  $('req-box').innerHTML = incoming.length ? "<div style='color:#2aabee;font-size:12px;font-weight:700;margin:10px 0 6px'>📩 ЗАЯВКИ В ДРУЗЬЯ</div>" : "";
  incoming.forEach(req => {
    const u = us.find(x => x.id === req.user_id);
    if (!u) return;
    $('req-box').innerHTML += `<div class="card" style="display:flex;justify-content:space-between;align-items:center"><b>@${u.username}</b><div style="display:flex;gap:6px"><button class="btn-sm" style="background:#28a745" onclick="ansFr(${req.id},'accepted')">Принять</button><button class="btn-sm sec" onclick="ansFr(${req.id},'rejected')">✕</button></div></div>`;
  });

  const fIds = getFriendIds();
  $('flist').innerHTML = "";
  fIds.forEach(id => {
    const u = us.find(x => x.id === id);
    if (!u) return;
    $('flist').innerHTML += `<div class="card" style="display:flex;justify-content:space-between;align-items:center"><b>@${u.username}${u.is_owner ? '<span class="ok">✓</span>' : ''}</b><button class="btn-sm sec" onclick="delFr('${u.id}')">Удалить</button></div>`;
  });
  if (!$('flist').innerHTML) $('flist').innerHTML = "<p style='color:#7f91a4;font-size:13px'>Список друзей пуст</p>";
}

function findFr() {
  const q = $('f-srch').value.trim().toLowerCase().replace('@', '');
  $('f-res').innerHTML = "";
  if (!q) return;
  const u = us.find(x => x.username.toLowerCase() === q && x.id !== me.id);
  if (!u) { $('f-res').innerHTML = "<p style='color:#ff6b6b;font-size:13px'>Пользователь не найден</p>"; return; }
  const rel = frs.find(f => (f.user_id === me.id && f.friend_id === u.id) || (f.friend_id === me.id && f.user_id === u.id));
  if (rel && rel.status === 'accepted') $('f-res').innerHTML = `<p style='color:#28a745;font-size:13px'>@${u.username} уже у тебя в друзьях</p>`;
  else if (rel && rel.status === 'pending') $('f-res').innerHTML = `<p style='color:#ffd700;font-size:13px'>Заявка уже отправлена</p>`;
  else $('f-res').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;padding-top:6px"><b>@${u.username}</b><button class="btn-sm" onclick="addFr('${u.id}')">Добавить в друзья</button></div>`;
}

async function addFr(fid) {
  await api("/rest/v1/friends", "POST", { user_id: me.id, friend_id: fid, status: 'pending' });
  alert("Заявка в друзья отправлена! 📩");
  $('f-res').innerHTML = ""; $('f-srch').value = "";
  loadAll();
}

async function ansFr(id, st) {
  if (st === 'rejected') await api("/rest/v1/friends?id=eq." + id, "DELETE");
  else await api("/rest/v1/friends?id=eq." + id, "PATCH", { status: 'accepted' });
  loadAll();
}

async function delFr(fid) {
  await api(`/rest/v1/friends?or=(and(user_id.eq.${me.id},friend_id.eq.${fid}),and(user_id.eq.${fid},friend_id.eq.${me.id}))`, "DELETE");
  loadAll();
}

function upAva(inp) {
  const f = inp.files.at(0);
  if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    const img = new Image();
    img.onload = async () => {
      const c = document.createElement('canvas'), s = 150;
      c.width = s; c.height = s;
      c.getContext('2d').drawImage(img, 0, 0, s, s);
      const b64 = c.toDataURL('image/jpeg', 0.7);
      await api("/rest/v1/profiles?id=eq." + me.id, "PATCH", { avatar: b64 });
      me.avatar = b64; setAva($('pava'), me); setAva($('nava'), me);
      alert("Фото обновлено! ✨");
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(f);
}

async function openC(u) {
  ch = u;
  $('ulist').classList.add('hidden'); $('bnav').classList.add('hidden'); $('top-bar').classList.add('hidden');
  $('main-box').style.paddingBottom = "0";
  $('cview').classList.remove('hidden'); $('bbtn').classList.remove('hidden'); $('cbtn').classList.remove('hidden');
  $('hdr').innerHTML = "@" + u.username + (u.is_owner ? '<span class="ok">✓</span>' : '');
  await loadM();
  tm = setInterval(loadM, 2000);
}

async function loadM() {
  if (!ch) return;
  const ms = await api(`/rest/v1/messages?or=(and(sender_id.eq.${me.id},receiver_id.eq.${ch.id}),and(sender_id.eq.${ch.id},receiver_id.eq.${me.id}))&order=created_at.asc`);
  $('mbox').innerHTML = "";
  ms.forEach(m => {
    const d = document.createElement('div');
    d.className = "msg " + (m.sender_id === me.id ? "mine" : "theirs");
    if (m.content.startsWith("CALL::")) {
      const rm = m.content.split("::").at(1);
      d.innerHTML = `📞 <b>Звонок</b><br><button onclick="joinC('${rm}')" style="margin-top:6px;padding:6px;background:#28a745">Ответить</button>`;
    } else d.innerText = m.content;
    $('mbox').appendChild(d);
  });
  $('mbox').scrollTop = $('mbox').scrollHeight;
}

function closeC() {
  ch = null; clearInterval(tm);
  $('cview').classList.add('hidden'); $('ulist').classList.remove('hidden'); $('bnav').classList.remove('hidden'); $('top-bar').classList.remove('hidden');
  $('main-box').style.paddingBottom = "78px";
