<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Suttongram</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth">
  <div class="logo">✈️</div>
  <h2 style="margin-bottom:14px">Suttongram</h2>
  <input id="uin" placeholder="Никнейм">
  <input type="password" id="pin" placeholder="Пароль (от 6 символов)">
  <button onclick="auth(0)">Войти</button>
  <button class="sec" onclick="auth(1)">Создать аккаунт</button>
  <p id="err" style="color:#ff6b6b;font-size:13px;margin-top:6px"></p>
</div>
<div id="app" class="hidden" style="display:flex;flex-direction:column;height:100dvh">
  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <button id="bbtn" class="sec hidden" onclick="closeC()" style="width:auto;margin:0;padding:6px 10px">←</button>
      <b id="hdr" style="font-size:19px">Suttongram</b>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="cbtn" class="sec hidden" onclick="call()" style="width:38px;height:38px;border-radius:50%;margin:0;padding:0">📞</button>
      <div class="stars">⭐ <span id="st">0</span></div>
    </div>
  </header>
  <div id="top-bar">
    <div class="search-wrap"><div class="search-box">🔍 <input id="srch" placeholder="Поиск по друзьям" oninput="renderList()"></div></div>
    <div class="tabs-bar"><span id="f-all" class="act" onclick="setFilter('all')">Все чаты</span><span id="f-own" onclick="setFilter('own')">👑 Владельцы</span></div>
  </div>
  <main id="main-box">
        <div id="t-chats" style="height:100%;display:flex;flex-direction:column">
      <div style="padding:10px 14px 0"><button class="sec" style="margin:0;padding:9px;font-size:13px" onclick="openGrpModal()">➕ Создать группу</button></div>
      <div id="grp-modal" class="hidden pad" style="background:#17212b;margin:10px;border-radius:16px">
        <h4 style="margin-bottom:8px">Новая группа</h4>
        <input id="grp-name" placeholder="Название группы">
        <div id="grp-friends" style="max-height:140px;overflow-y:auto;margin-bottom:10px"></div>
        <div style="display:flex;gap:8px"><button class="btn-sm" onclick="createGrp()">Создать</button><button class="btn-sm sec" onclick="$('grp-modal').classList.add('hidden')">Отмена</button></div>
      </div>
      <div id="ulist"></div>
      <div id="cview" class="hidden">
        <div id="mbox"></div>
        <div class="cbar"><input id="minp" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
      </div>
    </div>
    <div id="t-fr" class="hidden pad">
      <div class="card">
        <h4 style="margin-bottom:8px;font-size:15px">➕ Найти друга по нику</h4>
        <div style="display:flex;gap:8px"><input id="f-srch" placeholder="Введи ник (напр. grafin4ik)" style="margin:0"><button class="btn-sm" onclick="findFr()">Найти</button></div>
        <div id="f-res" style="margin-top:10px"></div>
      </div>
      <div id="req-box"></div>
      <div style="color:#7f91a4;font-size:12px;font-weight:700;margin:12px 0 8px">👥 МОИ ДРУЗЬЯ</div>
      <div id="flist"></div>
    </div>
    <div id="t-shop" class="hidden pad">
      <div class="card"><div style="color:#7f91a4;font-size:12px;margin-bottom:6px">🎁 КОМУ ОТПРАВИТЬ ПОДАРОК:</div><select id="grec" style="margin:0"></select></div>
      <div class="grid" id="slist"></div>
    </div>
    <div id="t-prof" class="hidden pad">
      <div class="card" style="display:flex;align-items:center;gap:14px">
        <div id="pava" class="ava lg" onclick="$('ain').click()"></div>
        <input type="file" id="ain" accept="image/*" class="hidden" onchange="upAva(this)">
        <div><b id="pname" style="font-size:18px"></b><div id="prole" style="color:#2aabee;font-size:13px">в сети</div><div onclick="$('ain').click()" style="color:#7f91a4;font-size:12px;margin-top:6px">📷 Сменить фото</div></div>
      </div>
      <div class="grid" id="mgifts"></div>
      <button class="sec" onclick="logout()" style="margin-top:16px;color:#ff6b6b">Выйти</button>
    </div>
    <div id="t-own" class="hidden pad">
      <div class="card"><h4 style="margin-bottom:8px">👑 Выдать звёзды</h4><select id="ausel"></select><input type="number" id="aamt" placeholder="Сколько звёзд"><button onclick="give()">Выдать звёзды</button></div>
      <div class="card">
        <h4 style="margin-bottom:8px">➕ Создать подарок</h4>
        <input type="file" id="ngf" accept="image/*" class="hidden" onchange="prevG(this)">
        <button class="sec" id="ngf-btn" onclick="$('ngf').click()">🖼️ Выбрать картинку из галереи</button>
        <input id="nge" placeholder="Или введи эмодзи (напр. 🧸)">
        <input id="ngn" placeholder="Название подарка">
        <input type="number" id="ngp" placeholder="Цена в звёздах">
        <button onclick="addG()">Добавить в магазин</button>
      </div>
      <div style="color:#7f91a4;font-size:12px;font-weight:700;margin:12px 0 8px">🗑️ УПРАВЛЕНИЕ МАГАЗИНОМ</div>
      <div id="aglist"></div>
    </div>
  </main>
  <nav id="bnav">
    <button class="act" onclick="tab('chats',this)"><span style="font-size:18px">💬</span>Чаты</button>
    <button onclick="tab('fr',this)"><span style="font-size:18px">👥</span>Друзья<span id="fbadge" class="badge hidden">0</span></button>
    <button onclick="tab('shop',this)"><span style="font-size:18px">🛍️</span>Подарки</button>
    <button onclick="tab('prof',this)"><div id="nava" class="ava xs"></div>Профиль</button>
    <button id="nown" class="hidden" onclick="tab('own',this)"><span style="font-size:18px">👑</span>Админка</button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
